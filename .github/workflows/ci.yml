name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Package VSIX
        run: bunx vsce package --no-dependencies --out dsconfig-helper.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: dsconfig-helper-vsix
          path: dsconfig-helper.vsix
